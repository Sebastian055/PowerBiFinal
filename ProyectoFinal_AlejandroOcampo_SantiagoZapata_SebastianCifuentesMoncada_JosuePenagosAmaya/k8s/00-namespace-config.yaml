apiVersion: v1
kind: Namespace
metadata:
  name: solar-bi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: solar-config
  namespace: solar-bi
data:
  POSTGRES_DB: "solar_db"
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  SIM_INTERVAL_SEC: "5"
  SAMPLE_STEP: "60"
---
apiVersion: v1
kind: Secret
metadata:
  name: solar-secret
  namespace: solar-bi
type: Opaque
stringData:
  POSTGRES_USER: "solar_user"
  POSTGRES_PASSWORD: "solar_pass"
  GF_SECURITY_ADMIN_USER: "admin"
  GF_SECURITY_ADMIN_PASSWORD: "admin" 